# Builds and tests the Rust backend (server-rs) with the web UI (apps/web, no build step) embedded, for macOS and Linux
# (static musl).
# Pull requests and pushes to main: test + build, binaries kept as workflow artifacts for 14 days.
# A tag v* additionally publishes them as a GitHub release: devicedock-<target>.tar.gz (the binary and the console
# script devicedock.sh), SHA256SUMS, and install.sh (which downloads and checks the archive).
name: backend

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths: [server-rs/**, apps/web/**, tests/**, deno.json, deno.lock, devicedock.sh, install.sh, .github/workflows/backend.yml]
  pull_request:
    paths: [server-rs/**, apps/web/**, tests/**, deno.json, deno.lock, devicedock.sh, install.sh, .github/workflows/backend.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: aarch64-apple-darwin, runner: macos-latest, native: true }
          - { target: x86_64-apple-darwin, runner: macos-latest, native: false }
          - { target: x86_64-unknown-linux-musl, runner: ubuntu-24.04, native: true }
          - { target: aarch64-unknown-linux-musl, runner: ubuntu-24.04-arm, native: true }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        if: matrix.target == 'x86_64-unknown-linux-musl'
        with: { deno-version: v2.5.6 }
      - name: Web UI unit tests (Deno)
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: deno test
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: "${{ matrix.target }}" }
      - if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: server-rs, key: "${{ matrix.target }}" }
      # Unit tests, plus black-box tests of the binary (server-rs/tests): the backend over HTTP and WebSockets, and the
      # sandbox side (bridge, device CLI, MCP, RFC 2217) end to end, on test ports.
      - name: Tests
        if: matrix.native
        run: cargo test --manifest-path server-rs/Cargo.toml --target ${{ matrix.target }}
      - name: Build
        run: cargo build --release --manifest-path server-rs/Cargo.toml --target ${{ matrix.target }}
      - name: Browser tests against the binary's embedded page (headless Chrome)
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: DEVICEDOCK_BIN=server-rs/target/${{ matrix.target }}/release/devicedock deno test --allow-all tests/browser/
      - name: Package
        run: |
          mkdir -p out && cp server-rs/target/${{ matrix.target }}/release/devicedock devicedock.sh out/
          tar -C out -czf devicedock-${{ matrix.target }}.tar.gz devicedock devicedock.sh
          ls -la devicedock-${{ matrix.target }}.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: devicedock-${{ matrix.target }}
          path: devicedock-${{ matrix.target }}.tar.gz
          retention-days: 14

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with: { sparse-checkout: install.sh, sparse-checkout-cone-mode: false }
      - uses: actions/download-artifact@v4
        with: { pattern: devicedock-*, merge-multiple: true }
      - run: sha256sum devicedock-*.tar.gz > SHA256SUMS && cat SHA256SUMS
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" --repo "${{ github.repository }}" --generate-notes devicedock-*.tar.gz SHA256SUMS install.sh
